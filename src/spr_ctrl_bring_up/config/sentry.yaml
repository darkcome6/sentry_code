controller_manager:
  ros__parameters:
    update_rate: 500  # Hz（虚拟机调试建议 500；真机可恢复 1000）

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"
    gimbal_controller:
      type: "spr_gimbal_controller/SprGimbalController"
    chassis_controller:
      type: "spr_chassis_controller/ChassisController"
gimbal_controller:
  ros__parameters:
    pitch:
      joint: "pitch_joint"
      max: 3.0
      min: 2.3
      scan_add: 0.001
      scan_range: [2.4, 3.0]
      pid:
        # 量纲：位置环输出 = 力矩(N·m)。P 增益单位 N·m/rad。
        p: 3.0
        i: 0.05
        d: 0.0
        i_min: -0.2
        i_max: 0.2
        i_clamp_min: -0.3
        i_clamp_max: 0.3
        # 位置环输出限幅 = 力矩(N·m)，DM4310 tor_max=10，留余量用 ±8
        output_min: -8.0
        output_max: 8.0
    small_yaw:
      joint: "small_yaw_joint"
      max: 3.14
      min: -3.14
      scan_add: 0.001
      scan_range: [-3.14, 3.14]
      pid:
        p: 3.0
        i: 0.0
        d: 0.0
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -8.0
        output_max: 8.0
    big_yaw:
      joint: "bigyaw_joint"
      max: 1.57
      min: -1.57
      scan_add: 0.001
      scan_range: [0.0, 0.0]
      pid:
        p: 8.0
        i: 0.0
        d: 0.3
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -30000.0
        output_max: 30000.0
chassis_controller:
  ros__parameters:
    # 麦克纳姆轮底盘几何（必须与 URDF 一致：轮半径0.1, 轴距0.4, 轮距0.5）
    wheel_base: 0.4
    track_width: 0.5
    wheel_radius: 0.1
    # 麦克纳姆轮布置方向：x_type_a(默认) / x_type_b(镜像，辊子方向相反时用)
    #   实测：前进正常但横移&旋转都反向 → 改成 x_type_b
    #   已按真机辊子方向改为 x_type_b，保证真机与 RViz 里程计一致
    wheel_layout: "x_type_a"
    left_wheel_front:
      joint: "left_wheel_front_joint"
      pid:
        p: 0.8
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0
    right_wheel_front:
      joint: "right_wheel_front_joint"
      pid:
        p: 0.8
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0
    left_wheel_back:
      joint: "left_wheel_back_joint"
      pid:
        p: 0.3
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0
    right_wheel_back:
      joint: "right_wheel_back_joint"
      pid:
        p: 0.8
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0