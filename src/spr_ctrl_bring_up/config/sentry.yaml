controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"
    gimbal_controller:
      type: "spr_gimbal_controller/SprGimbalController"
gimbal_controller:
  ros__parameters:
    pitch:
      joint: "pitch_joint"
      max: 0.5
      min: -0.5
      scan_add: 0.001
      scan_range: [0.0, 0.0]
      pid:
        p: 1.0
        i: 0.0
        d: 0.1
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        # 位置环输出限幅（电流/力矩原始值，DM4310 按实际力矩范围调小）
        output_min: -30000.0
        output_max: 30000.0
    small_yaw:
      joint: "small_yaw_joint"
      max: 1.57
      min: -1.57
      scan_add: 0.001
      scan_range: [0.0, 0.0]
      pid:
        p: 1.0
        i: 0.0
        d: 0.1
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        # 位置环输出限幅（电流原始值，GM6020 实际范围约 ±30000）
        output_min: -30000.0
        output_max: 30000.0
    big_yaw:
      joint: "big_yaw_joint"
      max: 1.57
      min: -1.57
      scan_add: 0.001
      scan_range: [0.0, 0.0]
      pid:
        p: 1.0
        i: 0.0
        d: 0.1
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        # 位置环输出限幅（力矩原始值，DM6006 按实际力矩范围调小）
        output_min: -30000.0
        output_max: 30000.0