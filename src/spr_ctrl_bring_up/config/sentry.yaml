controller_manager:
  ros__parameters:
    update_rate: 500  # Hz（虚拟机调试建议 500；真机可恢复 1000）

    # 必须关闭内存锁定（重要）：
    # mujoco_ros2_control 节点默认开启 lock_memory=true，会对进程执行
    # mlockall(MCL_CURRENT|MCL_FUTURE) 锁定全部内存。本机 MuJoCo 场景加载后
    # RSS≈925MB，而本机 RLIMIT_MEMLOCK(ulimit -l) 仅 909MB，configure 控制器时
    # 分配新内存（PID/订阅器/发布器/RealtimePublisher 线程栈）无法锁定，
    # 报 "Resource temporarily unavailable" (EAGAIN)，导致所有控制器配置失败。
    # 另一台电脑正常是因为其 RLIMIT_MEMLOCK 更大/无限制。
    # 仿真场景无需实时锁内存；若需保留实时保护，请提高系统 RLIMIT_MEMLOCK。
    lock_memory: false

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"
    gimbal_controller:
      type: "spr_gimbal_controller/SprGimbalController"
    chassis_controller:
      type: "spr_chassis_controller/ChassisController"
gimbal_controller:
  ros__parameters:
    # 量纲：位置环输出 = 力矩(N·m)。P 增益单位 N·m/rad。
    pitch:
      joint: "pitch_joint"
      max: 3.0
      min: 2.3
      scan_add: 0.001
      scan_range: [2.4, 3.0]
      pid:
        p: 3.0
        i: 0.05
        d: 0.0
        i_min: -0.2
        i_max: 0.2
        i_clamp_min: -0.3
        i_clamp_max: 0.3
        output_min: -8.0
        output_max: 8.0
    small_yaw:
      joint: "small_yaw_joint"
      max: 3.14
      min: -3.14
      scan_add: 0.001
      scan_range: [-3.14, 3.14]
      pid:
        p: 3.0
        i: 0.0
        d: 0.0
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -8.0
        output_max: 8.0
    big_yaw:
      joint: "bigyaw_joint"
      max: 1.57
      min: -1.57
      scan_add: 0.001
      scan_range: [0.0, 0.0]
      pid:
        p: 8.0
        i: 0.0
        d: 0.3
        i_min: -1.0
        i_max: 1.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -30000.0
        output_max: 30000.0
chassis_controller:
  ros__parameters:
    # 麦克纳姆轮底盘几何（必须与 URDF 一致：轮半径0.1, 轴距0.4, 轮距0.5）
    wheel_base: 0.4
    track_width: 0.5
    wheel_radius: 0.1
    wheel_layout: "x_type_a"
    left_wheel_front:
      joint: "left_wheel_front_joint"
      pid:
        p: 0.8
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0
    right_wheel_front:
      joint: "right_wheel_front_joint"
      pid:
        p: 0.8
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0
    left_wheel_back:
      joint: "left_wheel_back_joint"
      pid:
        p: 0.3
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0
    right_wheel_back:
      joint: "right_wheel_back_joint"
      pid:
        p: 0.8
        i: 0.0
        d: 0.0
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        output_min: -3.0
        output_max: 3.0