      p: {
        type: double,
        default_value: 0.0,
        description: "Proportional gain"
      }
      i: {
        type: double,
        default_value: 0.0,
        description: "Integral gain"
      }
      d: {
        type: double,
        default_value: 0.0,
        description: "Derivative gain"
      }
      i_clamp_max: {
        type: double,
        default_value: 0.0,
        description: "Upper integral clamp."
      }
      i_clamp_min: {
        type: double,
        default_value: 0.0,
        description: "Lower integral clamp."
      }
      output_min: {
        type: double,
        default_value: -30000.0,
        description: "Lower clamp of velocity PID output (current raw value)"
      }
      output_max: {
        type: double,
        default_value: 30000.0,
        description: "Upper clamp of velocity PID output (current raw value)"
      }
  left_wheel_back:
    joint: {
      type: string,
      default_value: "",
      description: "Joint name of left_wheel_back",
      validation: {
        not_empty<>: []
      }
    }
    pid:
      p: {
        type: double,
        default_value: 0.0,
        description: "Proportional gain"
      }
      i: {
        type: double,
        default_value: 0.0,
        description: "Integral gain"
      }
      d: {
        type: double,
        default_value: 0.0,
        description: "Derivative gain"
      }
      i_clamp_max: {
        type: double,
        default_value: 0.0,
        description: "Upper integral clamp."
      }
      i_clamp_min: {
        type: double,
        default_value: 0.0,
        description: "Lower integral clamp."
      }
      output_min: {
        type: double,
        default_value: -30000.0,
        description: "Lower clamp of velocity PID output (current raw value)"
      }
      output_max: {
        type: double,
