spr_gimbal_controller:
 aim_timeout: {
   type: double,
   default_value: 0.2,
   description: "自瞄信号看门狗(s)：距上次收到 mode=2 自瞄指令超过该时长，自动回落扫描"
 }
 pitch:
    joint: {
      type: string,
      default_value: "",
      description: "Joint names of the pitch joints",
      validation: {
        not_empty<>: []
      }
    }
    max: {
      type: double,
      default_value: 0.0,
      description: "Maximum pitch angle"
    }
    min: {
      type: double,
      default_value: 0.0,
      description: "Minimum pitch angle"
    }
    scan_add: {
      type: double,
      default_value: 0.001,
      description: "For sentry scan mode"
    }
    scan_range: {
      type: double_array,
      default_value: [0.0, 0.0],
      description: "For sentry scan mode"
    }
    pid:
      p: {
        type: double,
        default_value: 0.0,
        description: "Proportional gain"
      }
      i: {
        type: double,
        default_value: 0.0,
        description: "Integral gain"
      }
      d: {
        type: double,
        default_value: 0.0,
        description: "Derivative gain"
      }
      i_clamp_max: {
        type: double,
        default_value: 0.0,
        description: "Upper integral clamp."
      }
      i_clamp_min: {
        type: double,
        default_value: 0.0,
        description: "Lower integral clamp."
      }
      output_min: {
        type: double,
        default_value: -30000.0,
        description: "Lower clamp of position PID output (current/torque raw value)"
      }
      output_max: {
        type: double,
        default_value: 30000.0,
        description: "Upper clamp of position PID output (current/torque raw value)"
      }
